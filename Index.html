<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Fracciones</title>
    <link rel="stylesheet" href="style.css">
    <script src="Script.js"></script>
</head>

<body>

<div class="contenedor">

    <h1>🧮 Calculadora de Fracciones</h1>
    <p>Realiza operaciones matemáticas con fracciones fácilmente.</p>

    <div class="fracciones">

        <div class="fraccion">
            <input type="number" id="num1" placeholder="Numerador">
            <div class="linea"></div>
            <input type="number" id="den1" placeholder="Denominador">
        </div>

        <div class="operador">
            <select id="operacion">
                <option value="+">+</option>
                <option value="-">−</option>
                <option value="*">×</option>
                <option value="/">÷</option>
            </select>
        </div>

        <div class="fraccion">
            <input type="number" id="num2" placeholder="Numerador">
            <div class="linea"></div>
            <input type="number" id="den2" placeholder="Denominador">
        </div>

    </div>

    <button onclick="calcular()">Calcular</button>
    <button onclick="simplificar()">Simplificar primera fracción</button>
    <button onclick="limpiar()">Limpiar</button>

    <div class="resultado" id="resultado">
        Resultado: —
    </div>

</div>



</body>
</html>
